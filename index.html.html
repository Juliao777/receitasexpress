
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>GERADOR DE RECEITAS EXPRESS</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #f8f9fa, #e9ecef);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 450px;
      text-align: center;
    }
    h1 {
      color: #343a40;
      margin-bottom: 20px;
    }
    p {
      margin-bottom: 10px;
      color: #495057;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ced4da;
      resize: none;
      font-size: 14px;
    }
    button {
      margin-top: 15px;
      padding: 12px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    #resposta {
      margin-top: 20px;
      background: #f1f3f5;
      padding: 15px;
      border-radius: 6px;
      text-align: left;
      white-space: pre-wrap;
      color: #212529;
    }
    #downloadBtn {
      margin-top: 15px;
      display: none;
      background-color: #007bff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GERADOR DE RECEITAS EXPRESS</h1>
    <p>Digite os ingredientes disponíveis abaixo:</p>
    <textarea id="ingredientes" placeholder="Ex: frango, tomate, arroz..."></textarea>
    <button onclick="gerarReceita()">Gerar Receita</button>
    <button id="downloadBtn" onclick="baixarReceita()">Baixar Receita</button>
    <div id="resposta"></div>
  </div>

  <script>
    async function gerarReceita() {
      const ingredientes = document.getElementById('ingredientes').value;
      const respostaDiv = document.getElementById('resposta');
      const downloadBtn = document.getElementById('downloadBtn');
      respostaDiv.innerHTML = "Gerando receita... 🍳";
      downloadBtn.style.display = "none";

      const prompt = `Com os ingredientes: ${ingredientes}, crie uma receita simples com nome da receita, modo de preparo e tempo aproximado.`;

      const resposta = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer 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"
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.7
        })
      });

      const dados = await resposta.json();
      const receita = dados.choices[0].message.content;
      respostaDiv.innerHTML = receita;
      downloadBtn.style.display = "inline-block";
    }

    function baixarReceita() {
      const conteudo = document.getElementById('resposta').innerText;
      const blob = new Blob([conteudo], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "receita.txt";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
